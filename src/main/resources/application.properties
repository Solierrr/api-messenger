spring.application.name=messager

spring.config.import=optional:file:.env[.properties]


spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/solaria_messenger_db?uuidRepresentation=standard}
spring.data.mongodb.database=solaria_messenger_db
spring.data.mongodb.auto-index-creation=true

spring.data.mongodb.uuid-representation=standard

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

app.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app.jwt.issuer=solaria-auth
app.jwt.service.secret=${SERVICE_JWT_SECRET}
app.jwt.service.client-secret=${SERVICE_CLIENT_SECRET}
app.jwt.service.issuer=${SERVICE_JWT_ISSUER:solaria-messenger-internal}
app.jwt.service.access-ttl-ms=${SERVICE_JWT_ACCESS_TTL_MS:600000}
app.jwt.service.refresh-ttl-ms=${SERVICE_JWT_REFRESH_TTL_MS:3600000}
