spring.application.name=messager

spring.mongodb.uri=mongodb://localhost:27017/solaria_messenger_test?uuidRepresentation=standard
spring.mongodb.database=solaria_messenger_test
spring.data.mongodb.auto-index-creation=false

spring.mongodb.representation.uuid=standard

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

app.admin.subs=

app.jwt.jwk-set-uri=http://localhost:8081/.well-known/jwks.json
app.jwt.issuer=solaria-auth


app.broker.host=localhost
app.broker.stomp-port=61613
app.broker.login=guest
app.broker.passcode=guest
app.broker.auto-startup=false

spring.data.redis.url=redis://localhost:6379
management.health.redis.enabled=false

app.integration.core.base-url=http://localhost:8080
app.integration.core.connect-timeout=PT2S
app.integration.core.read-timeout=PT3S

management.tracing.enabled=false
management.logging.export.enabled=false
management.otlp.metrics.export.enabled=false
management.opentelemetry.resource-attributes.deployment.environment=test
