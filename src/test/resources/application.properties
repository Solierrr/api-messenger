spring.application.name=messager

spring.data.mongodb.uri=mongodb://localhost:27017/solaria_messenger_db?uuidRepresentation=standard
spring.data.mongodb.database=solaria_messenger_db
# Unit and MVC tests must not require a running MongoDB instance merely to boot
# the application context. Indexes are managed by the application/runtime DB.
spring.data.mongodb.auto-index-creation=false

spring.data.mongodb.uuid-representation=standard

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

app.jwt.jwk-set-uri=http://localhost:8081/.well-known/jwks.json
app.jwt.issuer=solaria-auth
app.jwt.service.secret=test-only-service-jwt-secret-with-at-least-32-bytes
app.jwt.service.client-secret=test-only-service-client-secret
app.jwt.service.issuer=solaria-messenger-internal-test
app.jwt.service.access-ttl-ms=600000
app.jwt.service.refresh-ttl-ms=3600000
